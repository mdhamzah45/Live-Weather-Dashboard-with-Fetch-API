<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live weather dashboard with city search, forecast, and friendly error handling."
    />
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard-shell">
      <section class="weather-app" aria-labelledby="weather-heading">
        <header class="topbar">
          <div>
            <p class="eyebrow">Weather tracker</p>
            <h1 id="weather-heading">Forecast at a glance</h1>
          </div>
        </header>

        <form id="search-form" class="search-form" novalidate>
          <label class="sr-only" for="city-input">Search city</label>
          <input
            id="city-input"
            type="text"
            name="city"
            placeholder="Search for a city"
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>

        <p id="status-message" class="status-message" aria-live="polite"></p>

        <section id="weather-content" class="weather-content hidden" aria-live="polite"></section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
